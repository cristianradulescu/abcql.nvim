services:
  mysql:
    image: mysql:8.4
    container_name: abcql-employees-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_USER: ${MYSQL_USER:-dbuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dbpassword}
    ports:
      - "${MYSQL_PORT:-33060}:3306"
    volumes:
      - abcql_employees_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 5s
      timeout: 5s
      retries: 30

  employees-loader:
    image: mysql:8.4
    container_name: abcql-employees-loader
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_USER: ${MYSQL_USER:-dbuser}
    entrypoint: ["bash", "/loader/load-employees.sh"]
    volumes:
      - ./docker/load-employees.sh:/loader/load-employees.sh:ro
      - abcql_employees_repo_cache:/tmp/test_db

volumes:
  abcql_employees_mysql_data:
  abcql_employees_repo_cache:
